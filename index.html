<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Care Corner｜懶人精緻選物所</title>
  <style>
    :root {
      --bg-color: #f7f3f0;
      --card-bg: #ffffff;
      --primary-accent: #c49a90;
      --primary-hover: #b0857b;
      --text-main: #4a423e;
      --text-sub: #8c827a;
      --border-color: #efe8e3;
      --tag-bg: #f5ebe6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; padding: 20px 12px; }
    .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }

    /* 頁頭標題 */
    .header-card { 
      background-color: var(--card-bg); 
      padding: 22px 40px 20px 20px; 
      border-radius: 20px; 
      text-align: center; 
      position: relative; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
    }
    .header-card h1 { font-size: 1.25rem; color: var(--primary-accent); word-break: break-word; line-height: 1.3; }
    .header-card p { font-size: 0.85rem; color: var(--text-sub); margin-top: 6px; }
    
    /* 後台管理 Icon 按鈕 */
    .admin-icon-btn {
      position: absolute; 
      top: 16px; 
      right: 16px; 
      background: var(--tag-bg); 
      border: none;
      color: var(--primary-accent); 
      width: 32px;
      height: 32px;
      border-radius: 50%; 
      font-size: 1rem; 
      cursor: pointer; 
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section-card { background-color: var(--card-bg); padding: 18px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    .section-title { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }

    /* 後台面板 */
    .admin-panel { display: none; background: #faf3f0; border: 1px dashed var(--primary-accent); padding: 14px; border-radius: 14px; margin-bottom: 16px; }
    .admin-mode .admin-panel { display: block; }
    .admin-panel label { font-size: 0.8rem; font-weight: bold; color: var(--text-main); display: block; margin-top: 8px; margin-bottom: 4px; }
    .admin-panel input { width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.85rem; background: white; }
    .admin-panel button { width: 100%; padding: 10px; background: var(--primary-accent); color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 12px; cursor: pointer; }

    /* 產品展示區 */
    .product-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-color); position: relative; }
    .product-item:last-child { border-bottom: none; }
    .product-img { width: 75px; height: 75px; border-radius: 12px; background-color: var(--tag-bg); object-fit: cover; }
    .product-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-title { font-size: 0.95rem; font-weight: 600; }
    .product-price { font-size: 0.85rem; color: #b85b5b; font-weight: bold; margin-top: 2px; }
    .product-desc { font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }
    .product-action { display: flex; justify-content: flex-end; margin-top: 6px; }
    
    .inquire-link {
      font-size: 0.8rem; color: white; background-color: var(--primary-accent);
      text-decoration: none; font-weight: 600; padding: 6px 12px; border-radius: 8px;
    }

    /* 管理員專用刪除/回覆按鈕 */
    .admin-btn { display: none; background: #e06d6d; color: white; border: none; padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; cursor: pointer; margin-left: 4px; }
    .admin-reply-btn { background: var(--primary-accent); }
    .admin-mode .admin-btn { display: inline-block; }

    /* WhatsApp 區 */
    .whatsapp-btn { display: block; width: 100%; padding: 12px; background-color: var(--primary-accent); color: white; text-align: center; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 0.9rem; }

    /* 計算器與留言板 */
    .calc-row, .comment-input-group { display: flex; gap: 8px; margin-bottom: 8px; }
    .calc-input, .comment-input { flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 10px; background-color: #faf7f5; font-size: 0.9rem; outline: none; }
    .calc-btn, .comment-submit { padding: 10px 16px; background-color: var(--primary-accent); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .calc-result { margin-top: 10px; padding: 12px; background-color: var(--tag-bg); border-radius: 10px; text-align: center; font-weight: 600; }
    
    /* 留言板列表 */
    .comment-list { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
    .comment-item { padding: 10px 12px; background-color: #faf7f5; border-radius: 10px; font-size: 0.8rem; position: relative; }
    .comment-reply { margin-top: 6px; padding: 6px 10px; background-color: #f0e6e1; border-radius: 6px; color: var(--text-main); font-size: 0.78rem; }
    .empty-tip { font-size: 0.8rem; color: var(--text-sub); text-align: center; padding: 10px 0; }
  </style>
</head>
<body>

  <div class="app-container" id="app">
    
    <div class="header-card">
      <button class="admin-icon-btn" onclick="toggleAdmin()" title="後台管理">⚙️</button>
      <h1>A Care Corner｜懶人精緻選物所</h1>
      <p>日常好物與精選雜貨</p>
    </div>

    <div class="section-card">
      <div class="section-title">🛍️ 待售雜貨目錄</div>

      <div class="admin-panel">
        <b style="font-size:0.9rem; color:var(--primary-accent);">＋ 上架新雜貨</b>
        
        <label>物品名稱</label>
        <input type="text" id="p-title" placeholder="例如：3M 醫療膠帶">
        
        <label>價格 (HK$)</label>
        <input type="number" id="p-price" placeholder="例如：15">
        
        <label>物品簡述</label>
        <input type="text" id="p-desc" placeholder="例如：全新未拆，多買轉讓">
        
        <label>上傳相片</label>
        <input type="file" id="p-file" accept="image/*">

        <button onclick="addProduct()">確認上架物品</button>
      </div>

      <div id="product-list"></div>
    </div>

    <div class="section-card">
      <div class="section-title">💬 一般問題查詢</div>
      <a href="https://api.whatsapp.com/send?phone=85291703190&text=你好！想查詢關於 A Care Corner 的相關問題。" target="_blank" class="whatsapp-btn">
        💬 一鍵聯絡店主查詢
      </a>
    </div>

    <div class="section-card">
      <div class="section-title">🧮 幾件合購總額計算器</div>
      <div class="calc-row">
        <input type="number" id="num1" class="calc-input" placeholder="物品 1 金額 ($)">
        <input type="number" id="num2" class="calc-input" placeholder="物品 2 金額 ($)">
      </div>
      <div class="calc-row">
        <input type="number" id="num3" class="calc-input" placeholder="物品 3 金額 ($)">
        <button onclick="calculateTotal()" class="calc-btn" style="width:100%;">計算總額</button>
      </div>
      <div class="calc-result">預估總金額： HK$ <span id="total-price">0</span></div>
    </div>

    <div class="section-card">
      <div class="section-title">📝 買家留言板</div>
      <div class="comment-input-group">
        <input type="text" id="comment-text" class="comment-input" placeholder="寫下您的查詢或建議...">
        <button onclick="addComment()" class="comment-submit">送出</button>
      </div>
      <div class="comment-list" id="comment-list"></div>
    </div>

  </div>

  <script>
    const ADMIN_PASSWORD = "0129"; 
    const PHONE_NUMBER = "85291703190";

    // 從本地讀取商品與留言資料
    let products = JSON.parse(localStorage.getItem('acc_products')) || [];
    let comments = JSON.parse(localStorage.getItem('acc_comments')) || [
      { id: 1, user: '買家', text: '請問洗頭水可以在地鐵站交收嗎？', reply: '可以的，詳情可以點擊 WhatsApp 聯絡～' }
    ];

    // 渲染商品
    function renderProducts() {
      const list = document.getElementById('product-list');
      list.innerHTML = '';
      
      if (products.length === 0) {
        list.innerHTML = '<div class="empty-tip">目前暫無待售物品，請點擊右上角 ⚙️ 上架物品。</div>';
        return;
      }

      products.forEach((p, index) => {
        const waText = encodeURIComponent(`你好！我想查詢「${p.title}」是否有貨？`);
        const waLink = `https://api.whatsapp.com/send?phone=${PHONE_NUMBER}&text=${waText}`;

        list.innerHTML += `
          <div class="product-item">
            <img src="${p.img}" class="product-img" alt="${p.title}">
            <div class="product-info">
              <div>
                <div class="product-title">
                  ${p.title} 
                  <button class="admin-btn" onclick="deleteProduct(${index})">下架</button>
                </div>
                <div class="product-price">HK$ ${p.price}</div>
                <div class="product-desc">${p.desc}</div>
              </div>
              <div class="product-action">
                <a href="${waLink}" target="_blank" class="inquire-link">私訊查詢 💬</a>
              </div>
            </div>
          </div>
        `;
      });
    }

    // 新增商品
    function addProduct() {
      const title = document.getElementById('p-title').value.trim();
      const price = document.getElementById('p-price').value.trim();
      const desc = document.getElementById('p-desc').value.trim();
      const fileInput = document.getElementById('p-file');

      if (!title || !price) {
        return alert('請至少填寫「物品名稱」與「價格」！');
      }

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          saveProductData(title, price, desc, e.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        saveProductData(title, price, desc, 'https://via.placeholder.com/75/f5ebe6/4a423e?text=雜貨');
      }
    }

    function saveProductData(title, price, desc, imgData) {
      products.unshift({ id: Date.now(), title, price, desc, img: imgData });
      localStorage.setItem('acc_products', JSON.stringify(products));
      renderProducts();

      document.getElementById('p-title').value = '';
      document.getElementById('p-price').value = '';
      document.getElementById('p-desc').value = '';
      document.getElementById('p-file').value = '';
      alert('成功上架物品！');
    }

    function deleteProduct(index) {
      if (confirm('確定下架這件物品？')) {
        products.splice(index, 1);
        localStorage.setItem('acc_products', JSON.stringify(products));
        renderProducts();
      }
    }

    // 渲染留言板
    function renderComments() {
      const list = document.getElementById('comment-list');
      list.innerHTML = '';

      if (comments.length === 0) {
        list.innerHTML = '<div class="empty-tip">暫無留言</div>';
        return;
      }

      comments.forEach((c, index) => {
        const replyHtml = c.reply ? `<div class="comment-reply"><b>店主回覆：</b>${c.reply}</div>` : '';
        list.innerHTML += `
          <div class="comment-item">
            <div>
              <b>${c.user}：</b>${c.text}
              <button class="admin-btn" onclick="deleteComment(${index})">刪除</button>
              <button class="admin-btn admin-reply-btn" onclick="replyComment(${index})">回覆</button>
            </div>
            ${replyHtml}
          </div>
        `;
      });
    }

    // 訪客新增留言
    function addComment() {
      const input = document.getElementById('comment-text');
      const text = input.value.trim();
      if (text !== "") {
        comments.unshift({ id: Date.now(), user: '訪客', text: text, reply: '' });
        localStorage.setItem('acc_comments', JSON.stringify(comments));
        renderComments();
        input.value = "";
      }
    }

    // 管理員回覆留言
    function replyComment(index) {
      const replyText = prompt("請輸入店主回覆內容：");
      if (replyText !== null && replyText.trim() !== "") {
        comments[index].reply = replyText.trim();
        localStorage.setItem('acc_comments', JSON.stringify(comments));
        renderComments();
      }
    }

    // 管理員刪除留言
    function deleteComment(index) {
      if (confirm('確定刪除這條留言？')) {
        comments.splice(index, 1);
        localStorage.setItem('acc_comments', JSON.stringify(comments));
        renderComments();
      }
    }

    // 管理員切換（含密碼）
    function toggleAdmin() {
      const app = document.getElementById('app');
      if (app.classList.contains('admin-mode')) {
        app.classList.remove('admin-mode');
      } else {
        const pwd = prompt("請輸入管理員密碼：");
        if (pwd === ADMIN_PASSWORD) {
          app.classList.add('admin-mode');
        } else if (pwd !== null) {
          alert("密碼錯誤！");
        }
      }
    }

    // 計算器
    function calculateTotal() {
      const v1 = parseFloat(document.getElementById('num1').value) || 0;
      const v2 = parseFloat(document.getElementById('num2').value) || 0;
      const v3 = parseFloat(document.getElementById('num3').value) || 0;
      document.getElementById('total-price').innerText = v1 + v2 + v3;
    }

    // 初始載入
    renderProducts();
    renderComments();
  </script>
</body>
</html>
